[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odeforge"
version = "0.1.0"
description = "Continuous-time dynamics numerical solvers and differentiable integration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星 (Chen Xing)", email = "CJX0712@users.noreply.github.com" }]
keywords = ["ode", "symplectic", "differentiable-simulation", "hamiltonian", "adjoint"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16"]

[project.scripts]
odeforge = "cli:main"

[tool.setuptools]
packages = [
  "core", "data", "integrators", "routing", "autodiff",
  "training", "hpo", "eval", "pipeline", "examples",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]
markers = [
  "slow: exercises the full acceptance gates; seconds rather than milliseconds",
]

[tool.coverage.run]
branch = true
source = ["core", "data", "integrators", "routing", "autodiff", "training", "hpo", "eval", "pipeline"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

# ruff is a HARD gate in CI. Rules are pinned explicitly rather than inherited from a
# default that shifts between releases; the version is pinned in requirements.lock.txt
# so "what passed here" is the same question as "what passes there".
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["_probe", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = [
  "E501",    # long lines are handled by the formatter, not the linter
  "PLR0912", # branch count: the DP54 controller and gate logic are genuinely branchy
  "PLR0913", # argument count: solver entry points take explicit, documented knobs
  "PLR0915", # statement count: same
  "PLR2004", # magic values: numerics domains are full of meaningful constants
  "PLW2901", # loop variable overwrite: the solver loops read better this way
  "B008",    # function call in default argument: deliberate for the CLI
  "SIM108",  # ternary: explicit if/else is clearer in the numerical kernels
  "PLR0917", # too many positional args: the RK4 step and composition kernels are
             # positional by design; the extra argument is the stage table, and
             # keyword-only form would obscure the numeric signature
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "PLR0915"]
"examples/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
